<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nocus - Intelligent Syllabus Tracker & Academic Mentor</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4B3FA0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="AI-Powered Syllabus Tracker, Pomodoro Focus Timer, Active Recall & Academic Study Mentor" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nocus" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration (Production Only) -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.protocol === 'https:') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister any accidental service worker on localhost so dev styles/scripts are always live
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        }
      }
    </script>
  </body>
</html>
