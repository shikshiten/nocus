<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>nocus</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json?v=4" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="AI-Powered Syllabus Tracker, Pomodoro Focus Timer, Active Recall & Academic Study Mentor" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="nocus" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />

    <!-- Instant Theme Hydration to prevent theme flash -->
    <script>
      try {
        if (localStorage.getItem("themeStyle") === "terracotta") {
          document.documentElement.setAttribute("data-theme", "terracotta");
        }
        if (localStorage.getItem("darkMode") === "true") {
          document.documentElement.classList.add("dark");
        }
        var savedPrimary = localStorage.getItem("primaryColor");
        if (savedPrimary) {
          document.documentElement.setAttribute("data-primary-color", savedPrimary);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration (Production Only) -->
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.protocol === 'https:') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister any accidental service worker on localhost so dev styles/scripts are always live
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        }
      }
    </script>
  </body>
</html>
